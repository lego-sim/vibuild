[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibuild"
version = "0.2.0"
description = "Video-guided Blender modeling with fresh Codex decisions"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<14"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
vibuild = "vibuild.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
vibuild = ["defaults.json", "agents/prompts/*.md", "assessment/*.json", "registration/*.html"]
