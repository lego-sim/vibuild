[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibuild"
version = "0.1.0"
description = "Video-guided Blender modeling with fresh Codex decisions"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tools = ["numpy", "Pillow"]
test = ["pytest"]

[project.scripts]
vibuild = "vibuild.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
